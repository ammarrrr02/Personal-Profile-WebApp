<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Personal Profile Website</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
          <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9fafb;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }

    .box {
        background: #ffffff;
        border: 1.5px solid #d1d5db; /* The clean line box */
        border-radius: 8px;
        padding: 24px 30px;
        width: 100%;
        max-width: 480px;
    }

    h2 {
        margin-top: 0;
        padding-bottom: 10px;
        border-bottom: 1.5px solid #e5e7eb; /* Line under the title */
    }

    input, textarea {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    button {
        padding: 10px 18px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
        
    </head>
    <body>
        
    <div class="box">
       
        <h2>Create Your Student Profile</h2>
        <!-- action="ProfileServlet" send data to servlet url -->
        <!-- method="POST" hides from data from the url-->
        <form action="ProfileServlet" method="POST">
            
            <label for="name">Full Name👤:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="studentID">Student ID🆔:</label><br>
            <input type="text" id="studentID" name="studentID" required><br><br>
            
            <label for="program">Program🎓:</label><br>
            <input type="text" id="program" name="program" required><br><br>
            
            <label for="email">Email Address📧:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="hobby">Hobby⚽:</label><br>
            <input type="text" id="hobby" name="hobby"><br><br>
            
            <label for="intro">Short Self Intro💬</label><br>
            <textarea id="intro" name="intro" rows="4" cols="40" required></textarea><br><br>
            
            <button type="submit">Submit Profile</button>
        </form>
         </div>
</body>
      
   
</html>
